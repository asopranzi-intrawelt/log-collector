# Accesso al collettore (handoff, sezione 2 punto 2, con account personali per ADR-008). sshd applica il primo valore che trova e
# Debian include sshd_config.d/*.conf in testa a sshd_config, quindi queste righe prevalgono.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowGroups ads-admin
