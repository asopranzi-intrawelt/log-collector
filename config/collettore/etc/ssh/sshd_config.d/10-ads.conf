# Accesso al collettore (handoff, sezione 2 punto 2). sshd applica il primo valore che trova e
# Debian include sshd_config.d/*.conf in testa a sshd_config, quindi queste righe prevalgono.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers adsadmin
