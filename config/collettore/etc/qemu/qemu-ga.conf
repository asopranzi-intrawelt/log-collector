# Guest agent ristretto (handoff, sezione 1). Con allow-rpcs definito, ogni RPC non elencato
# e' bloccato: restano spegnimento pulito, freeze per backup coerenti, fstrim, IP e ora in GUI.
# Esclusi guest-exec, guest-file-*, guest-set-user-password, guest-ssh-*, che darebbero
# all'amministratore dell'hypervisor un accesso alla VM che scavalca la credenziale distinta.
# [Non verificato] sintassi della chiave: controllare con `qemu-ga --dump-conf` e provare
# dall'host `qm guest exec <VMID> -- id`, che deve fallire (collaudo punto 1).
[general]
allow-rpcs=guest-sync-delimited,guest-sync,guest-ping,guest-info,guest-shutdown,guest-fsfreeze-status,guest-fsfreeze-freeze,guest-fsfreeze-freeze-list,guest-fsfreeze-thaw,guest-fstrim,guest-network-get-interfaces,guest-get-osinfo,guest-get-host-name,guest-get-time
