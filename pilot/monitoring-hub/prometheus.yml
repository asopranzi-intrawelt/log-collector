global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/netdata.json
